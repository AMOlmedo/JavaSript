<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tablas</title>
</head>
<body>
    <table border="2"> <!--borde de la tabla-->
        <caption> Filas y columnas ejemplo</caption>
        <tr>
            <th>columna 1 </th> <th>columna 2 </th> <th>columna 3</th>
        </tr>
        <tr> <!--fila de la tabla-->
            <td> elem 1,1</td> <td>elem 1,2</td><td>elem 1,3</td> <!-- celda de  la tabla-->
        </tr>
        <tr>
            <td>elem 2,1</td><td>elem 2,2</td><td>elem 2,3</td>
        </tr>
        <tr>
            <td>elem 3,1</td><td>elem 3,2</td><td>elem 3,3</td>
        </tr>

    </table>
</body>
</html>
